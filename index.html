<!doctype html>

<html lang="en">

<head>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Whimsy App</title>

    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="app.css">

</head>

<body>


    <!-- ================================ -->
    <!-- Main -->
    <!-- ================================ -->

    <main class="app-main app-main-with-header">

        <header class="app-title">
            <h1>🛒 Taobao Expense Splitter</h1>
            <p>Your Taobao haul, broken down.</p>
        </header>
        <section class="card card-main items-section">

            <div class="card-header">
                <h3>01 · Items</h3>
                <p>Add the items in your Taobao order.</p>
            </div>

            <div class="card-content">

                <div id="item-list">
                    <!-- Items will be generated by JavaScript -->
                </div>

                <button type="button" id="add-item-btn" class="button button-secondary button-medium">
                    + Add item
                </button>
                <div class="items-total">
                    Total: <strong>¥0.00</strong>
                </div>

            </div>

        </section>

        <section class="card card-main adjustments-section">
            <div class="card-header">
                <h3>02 · Discounts & Extra Charges</h3>
                <p>Account for discounts, shipping, GST and other adjustments.</p>
            </div>

            <div class="card-content">
                <div id="adjustment-list">
                    <!-- Adjustments will be generated by JavaScript -->
                </div>

                <button type="button" id="add-adjustment-btn" class="button button-secondary button-medium">
                    + Add adjustment
                </button>
            </div>
        </section>

    </main>


    <!-- ================================ -->
    <!-- Whimsy -->
    <!-- ================================ -->

    <script src="base.js"></script>
    <script src="app.js"></script>

</body>

</html>
